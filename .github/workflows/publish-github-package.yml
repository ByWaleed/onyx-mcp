name: Publish GitHub Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify selected version
        run: |
          git fetch origin main --tags
          test "$(git describe --tags --exact-match HEAD)" = "${{ inputs.tag }}"
          test "v$(node -p 'require("./package.json").version')" = "${{ inputs.tag }}"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@bywaleed"
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run verify
      - run: mkdir release && npm pack --pack-destination release
      - name: Publish if absent
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already published to GitHub Packages"
          else
            npm publish "./release/$(basename release/*.tgz)" --registry https://npm.pkg.github.com --provenance=false
          fi
