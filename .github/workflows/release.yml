name: GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Verify tag and main ancestry
        run: |
          git fetch origin main
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run verify
      - name: Build release artifacts
        run: |
          mkdir release
          npm pack --pack-destination release
          npm sbom --sbom-format spdx > release/sbom.spdx.json
          cd release
          shasum -a 256 *.tgz sbom.spdx.json > SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.tgz
            release/SHA256SUMS
            release/sbom.spdx.json
