name: Bug report
description: Report a reproducible problem with Onyx MCP
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Onyx MCP version
    validations:
      required: true
  - type: input
    id: onyx-version
    attributes:
      label: Onyx version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and MCP client/version.
    validations:
      required: true
  - type: input
    id: capabilities
    attributes:
      label: Enabled capability profiles
      description: For example, read-only, write, admin, destructive, or raw API.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Do not include tokens, credentials, or private document content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: checkboxes
    id: redacted
    attributes:
      label: Sensitive data
      options:
        - label: I removed tokens, credentials, and private document content.
          required: true
